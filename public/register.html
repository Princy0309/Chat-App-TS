<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Sign Up — ChatApp</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      background: #0f0f1a; color: #fff; padding: 16px;
    }
    .auth-card {
      width: 100%; max-width: 400px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px; padding: 32px 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .auth-title { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 8px; }
    .auth-sub { font-size: 14px; color: rgba(255,255,255,0.5); text-align: center; margin-bottom: 28px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.7); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    input {
      width: 100%; padding: 14px 16px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px; color: #fff; font-size: 15px; outline: none; transition: all 0.2s;
    }
    input:focus { border-color: #6c63ff; box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.2); }

    /* PASSWORD EYE WRAPPER */
    .password-wrapper { position: relative; display: flex; align-items: center; }
    .password-wrapper input { padding-right: 46px; }
    .eye-btn {
      position: absolute; right: 14px; background: none; border: none;
      cursor: pointer; font-size: 18px; color: rgba(255,255,255,0.5);
      user-select: none; display: flex; align-items: center; justify-content: center;
      transition: opacity 0.2s;
    }
    .eye-btn:hover { opacity: 1; }

    .btn {
      width: 100%; padding: 14px; margin-top: 10px;
      background: linear-gradient(135deg, #6c63ff, #8b5cf6);
      border: none; border-radius: 14px; color: #fff; font-size: 16px; font-weight: 600;
      cursor: pointer; transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .auth-footer { text-align: center; font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 20px; }
    .auth-footer a { color: #8b5cf6; text-decoration: none; font-weight: 600; }
    .error-msg {
      background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5; font-size: 13px; line-height: 1.4; padding: 12px;
      border-radius: 12px; margin-bottom: 16px; display: none; text-align: left;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-title">Create Account</div>
    <div class="auth-sub">Join the real-time chat room</div>
    <div id="errorMsg" class="error-msg"></div>
    <form id="registerForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Username" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="name@example.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="••••••••" maxlength="10" required autocomplete="new-password" />
          <button type="button" class="eye-btn" id="togglePassword" title="Show/Hide Password">👁️</button>
        </div>
      </div>
      <button type="submit" class="btn">Sign Up</button>
    </form>
    <div class="auth-footer">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </div>

  <script>
    // 1. PASSWORD EYE TOGGLE LOGIC
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    togglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      togglePassword.textContent = isPassword ? '🙈' : '👁️';
    });

    // 2. REGISTER FORM SUBMISSION WITH FIXED REGEX (NO SPACES!)
    const form = document.getElementById('registerForm');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = passwordInput.value.trim();

      // FIXED: {8,10} with ZERO space!
      const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[A-Za-z\d@$!%*?&#]{8,10}$/;
      if (!passwordRegex.test(password)) {
        errorMsg.textContent = 'Password must be between 8 and 10 characters long and contain at least one uppercase letter, one lowercase letter, and one number.';
        errorMsg.style.display = 'block';
        return;
      }

      try {
        const res = await fetch('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();

        if (res.ok) {
          window.location.href = 'login.html';
        } else {
          errorMsg.textContent = data.message || 'Registration failed';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = 'Unable to connect to server';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
